name: Build patched T3 Code
on:
  workflow_dispatch:
    inputs:
      patch_version:
        description: "Optional patch version override (e.g. 1.1). Defaults to patch_version in patch-release.json."
        type: string
        required: false
        default: ""
      verify_only:
        description: Rebuild and verify without publishing
        type: boolean
        default: false
      repair_draft:
        description: Replace assets of the existing draft release
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: patched-release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      tag: ${{ steps.check.outputs.tag }}
      commit: ${{ steps.check.outputs.commit }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            patch-release.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Resolve release tag and check existing releases
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_PATCH_VERSION: ${{ inputs.patch_version }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          REPAIR_DRAFT: ${{ inputs.repair_draft }}
        run: |
          set -euo pipefail
          upstream_tag="$(jq -r '.upstream_tag // empty' patch-release.json)"
          [[ "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid upstream_tag in patch-release.json: $upstream_tag"; exit 1; }
          patch_version="${INPUT_PATCH_VERSION:-$(jq -r '.patch_version // empty' patch-release.json)}"
          [[ "$patch_version" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "Invalid patch_version: $patch_version"; exit 1; }
          tag="${upstream_tag}-patch.${patch_version}"
          commit="$(git rev-parse HEAD)"
          releases="$(gh release list --repo "$REPO" --limit 1000 --json tagName --jq '.[].tagName')"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [[ "$VERIFY_ONLY" != "true" && "$REPAIR_DRAFT" != "true" ]] && printf '%s\n' "$releases" | grep -Fxq "$tag"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
  wsl-runtime:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Vite+ and Node
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y patchelf libsecret-1-dev pkg-config
      - name: Verify voice and tools on Linux
        run: vp test run apps/server/src/skills/SkillLibrary.test.ts apps/server/src/mcpServers/McpServerTools.test.ts apps/server/src/speech/SpeechService.test.ts packages/client-runtime/src/voice-input/stream.test.ts
      - name: Build patched WSL runtime
        env:
          TAG: ${{ needs.check.outputs.tag }}
          T3CODE_TELEMETRY_CHANNEL: dev
        run: |
          set -euo pipefail
          version="${TAG#v}"
          node scripts/update-release-package-versions.ts "$version"
          vp run build:desktop:bundle
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"
          node apps/server/scripts/cli.ts build-exe --verbose
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$version" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive "release-cli/t3-${version}-linux-x64.tar.gz" --expect-version "$version"
      - name: Upload patched WSL runtime
        uses: actions/upload-artifact@v4
        with:
          name: patched-wsl-runtime
          path: release-cli/t3-*-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  build:
    needs: [check, wsl-runtime]
    if: needs.check.outputs.build == 'true'
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Vite+ and Node
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Install T3 dependencies
        run: |
          vp install --frozen-lockfile --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify tests and types
        run: |
          Push-Location packages/shared
          vp test run src/semver.test.ts src/t3McpToolPresentation.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location apps/server
          vp test run src/mcp/toolkits/orchestrator/usageLimitsPatch.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location scripts
          vp test run --config ../vite.config.ts build-desktop-artifact.test.ts -t "bounds the Windows compile cache"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          vp run --filter t3 typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Align package versions with patched release
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          node scripts/update-release-package-versions.ts $env:TAG.Substring(1)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download patched WSL runtime
        uses: actions/download-artifact@v4
        with:
          name: patched-wsl-runtime
          path: wsl-runtime
      - name: Build Windows installer
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_TELEMETRY_CHANNEL: dev
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          $version = $env:TAG.Substring(1)
          $archive = @(Get-ChildItem wsl-runtime -File -Filter "t3-$version-linux-x64.tar.gz")
          if ($archive.Count -ne 1) { throw 'Missing patched WSL runtime.' }
          vp run dist:desktop:artifact --platform win --target nsis --arch x64 --build-version $version --keep-stage --wsl-runtime $archive[0].FullName
          if ($LASTEXITCODE -ne 0) {
            $buildExit = $LASTEXITCODE
            Get-ChildItem $env:TEMP -Directory -Filter 't3code-desktop-win-stage-*' | ForEach-Object {
              Get-ChildItem $_.FullName -Directory -Recurse -Filter '*-unpacked' | ForEach-Object {
                Write-Output "Packaged files in $($_.FullName):"
                Get-ChildItem $_.FullName -File -Recurse | ForEach-Object { $_.FullName.Substring($env:TEMP.Length) }
              }
            }
            exit $buildExit
          }
      - name: Verify release assets
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          if (-not (Test-Path release/latest.yml)) { throw 'Missing latest.yml; refusing to publish.' }
          $version = $env:TAG.Substring(1)
          $latestYml = Get-Content release/latest.yml -Raw
          if ($latestYml -notmatch "(?m)^version:\s*$([regex]::Escape($version))\s*$") {
            throw "latest.yml version does not match expected version $version."
          }
          $installers = @(Get-ChildItem release -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one installer, found $($installers.Count)." }
          $configs = @(Get-ChildItem $env:TEMP -Directory -Filter 't3code-desktop-win-stage-*' | ForEach-Object {
            Get-ChildItem $_.FullName -File -Recurse -Filter app-update.yml | Where-Object { $_.FullName -match '[\\/]win-unpacked[\\/]resources[\\/]app-update\.yml$' }
          })
          if ($configs.Count -ne 1) { throw "Expected exactly one packaged update config, found $($configs.Count)." }
          $resources = $configs[0].DirectoryName
          if (-not (Test-Path (Join-Path $resources 'wsl-runtime.tar.gz')) -or -not (Test-Path (Join-Path $resources 'wsl-runtime.tar.gz.sha256'))) { throw 'The packaged WSL runtime or checksum is missing.' }
          $feed = Get-Content $configs[0].FullName -Raw
          $parts = $env:GITHUB_REPOSITORY.Split('/')
          if ($feed -notmatch '(?m)^provider:\s*github\s*$' -or
              $feed -notmatch "(?m)^owner:\s*$([regex]::Escape($parts[0]))\s*$" -or
              $feed -notmatch "(?m)^repo:\s*$([regex]::Escape($parts[1]))\s*$") {
            throw 'Packaged update feed does not point to this GitHub repository.'
          }
      - name: Smoke-test packaged server startup
        shell: pwsh
        run: |
          $stages = @(Get-ChildItem $env:TEMP -Directory -Filter 't3code-desktop-win-stage-*')
          if ($stages.Count -ne 1) { throw 'Expected one build stage.' }
          $apps = @(Get-ChildItem $stages[0].FullName -File -Recurse -Filter 'T3 Code (Beta).exe' | Where-Object { $_.Directory.Name -eq 'win-unpacked' })
          if ($apps.Count -ne 1) { throw 'Expected one unpacked application.' }
          $root = Join-Path $env:RUNNER_TEMP 't3-smoke-profile'
          $env:T3CODE_HOME = Join-Path $root 'data'
          $env:USERPROFILE = Join-Path $root 'home'
          $env:HOME = $env:USERPROFILE
          $env:APPDATA = Join-Path $root 'home\AppData\Roaming'
          $env:LOCALAPPDATA = Join-Path $root 'home\AppData\Local'
          $env:CODEX_HOME = Join-Path $root 'home\.codex'
          $env:T3CODE_DISABLE_AUTO_UPDATE = 'true'
          $env:T3CODE_DESKTOP_APP_USER_MODEL_ID = 'com.michaelik.t3code.ci-smoke'
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $env:T3CODE_HOME 'userdata'), $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $env:T3CODE_HOME 'userdata\cli-command-first-launch') | Out-Null
          Start-Process -FilePath $apps[0].FullName -WorkingDirectory $apps[0].DirectoryName -WindowStyle Hidden | Out-Null
          $runtimeFile = Join-Path $env:T3CODE_HOME 'userdata\server-runtime.json'
          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            if (Test-Path $runtimeFile) {
              $runtime = Get-Content $runtimeFile -Raw | ConvertFrom-Json
              try { Invoke-WebRequest -Uri $runtime.origin -UseBasicParsing -TimeoutSec 2 | Out-Null; $ready = $true; break } catch { }
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            Get-Content (Join-Path $env:T3CODE_HOME 'userdata\logs\server-child.log') -ErrorAction SilentlyContinue | Select-Object -Last 60
            throw 'The packaged T3 server did not become ready.'
          }
      - name: Save verified Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verified-windows-release
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Publish release
        if: inputs.verify_only != true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          UPSTREAM_TAG: ${{ needs.check.outputs.upstream_tag }}
        run: |
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap' } | ForEach-Object { $_.FullName })
          if ('${{ inputs.repair_draft }}' -eq 'true') {
            $draft = gh release view $env:TAG --repo $env:REPO --json isDraft --jq .isDraft
            if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'Repair requires an existing draft release.' }
            gh release upload $env:TAG @assets --repo $env:REPO --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $env:TAG --repo $env:REPO --draft=false --latest
          } else {
            $notes = "Based on upstream T3 Code $env:UPSTREAM_TAG.`n`n## Included patches`n`n- Local voice dictation up to one hour; cloud transcription selection is disabled.`n- Tools & Skills management and composer presets.`n- Usage limits MCP tool.`n- Patched release auto-updater.`n`n## Downloads`n`nWindows x64 installer with WSL runtime. The installer is unsigned."
            gh release create $env:TAG @assets --repo $env:REPO --title "Patched T3 Code $env:TAG" --notes $notes --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
