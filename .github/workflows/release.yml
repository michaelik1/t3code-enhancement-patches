name: Build patched T3 Code
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: patched-release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Check latest upstream stable release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/pingdotgg/t3code/releases/latest --jq .tag_name)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected stable tag: $tag"; exit 1; }
          releases="$(gh release list --repo "$REPO" --limit 1000 --json tagName --jq '.[].tagName')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$releases" | grep -Fxq "$tag"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          path: patches-repo
          persist-credentials: false
      - name: Checkout exact upstream release tag
        uses: actions/checkout@v4
        with:
          repository: pingdotgg/t3code
          ref: ${{ needs.check.outputs.tag }}
          path: upstream
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Check source and apply patch
        run: node patches-repo/scripts/apply-patch.mjs upstream
      - name: Set up T3 build dependencies
        uses: ./upstream/.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - name: Verify patch and types
        working-directory: upstream
        run: |
          vp test run apps/server/src/mcp/toolkits/orchestrator/usageLimitsPatch.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          vp run --filter t3 typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        working-directory: upstream
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_TELEMETRY_CHANNEL: dev
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          $version = $env:TAG.Substring(1)
          vp run dist:desktop:artifact --platform win --target nsis --arch x64 --build-version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify release assets
        working-directory: upstream
        run: |
          if (-not (Test-Path release/latest.yml)) { throw 'Missing latest.yml; refusing to publish.' }
          $installers = @(Get-ChildItem release -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one installer, found $($installers.Count)." }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
        working-directory: upstream
        run: |
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap' } | ForEach-Object { $_.FullName })
          gh release create $env:TAG @assets --repo $env:REPO --title "Patched T3 Code $env:TAG" --notes "Based on upstream release $env:TAG. Includes the built-in t3_usage_limits MCP tool. Windows x64 build; unsigned." --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
